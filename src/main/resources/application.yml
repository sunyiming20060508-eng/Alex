server:
  port: ${SERVER_PORT:8080}
  # 优雅停机：收到 SIGTERM 后不再接新请求，等在途请求跑完再退出。
  # 下单是最怕被切一半的动作（本地事务 + Redis 幂等键），硬切会留下"键在、单没成"的脏状态。
  shutdown: graceful
  error:
    # 容器层错误（绕过 @RestControllerAdvice 的那部分）也显式收敛，不靠 Boot 的默认值
    include-message: never
    include-exception: false
    include-stacktrace: never
    whitelabel:
      enabled: false
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: 10
    accept-count: 100
    connection-timeout: 20s
spring:
  lifecycle:
    # 优雅停机等在途请求的上限；超过就强杀，避免部署时卡在一条慢 SQL 上
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      # 定时任务用的线程池。Boot 的默认值是 **1 条线程**（ScheduledThreadPoolExecutor corePoolSize=1），
      # 也就是所有 @Scheduled 方法共用这一条：本项目每分钟一次的超时单扫描一旦卡在慢 SQL / 行锁上，
      # 下一轮扫描和将来任何新任务都得排队，表现是"订单突然整批不关了"。
      # 给 2 条**不是**要让同一份扫描并发跑——同一个 @Scheduled 方法本来就不会和自己重叠；
      # 是让第二个定时任务落地时不至于被这一条线程串起来。真要调多少，等有第二个任务之后再量。
      pool:
        size: ${SCHED_POOL_SIZE:2}
      # 线程名进日志与线程转储：默认叫 scheduling-1，看不出是谁。改名后出问题时
      # 能直接从日志指认"是定时任务在跑，不是用户请求"。
      thread-name-prefix: sched-
      shutdown:
        # 停机时等在跑的这一轮扫完再退出。这是 server.shutdown: graceful 的另一半——
        # 那条管 HTTP 在途请求，这条管调度线程。本轮取消动作是一条带状态守卫的 UPDATE，
        # 掐在中间最多是"这轮没关完、下轮接着关"（幂等），但没必要留这个窗口。
        await-termination: true
        await-termination-period: 20s
  profiles:
    # 默认跑 dev，方便本机直接启动；部署时用 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application.name: life-service-api
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:life_service}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123456}
    hikari:
      pool-name: life-hikari
      # 默认 10 连接在小单机够用，但必须显式写出来：不写就等于"连接被慢查询占满时用户看到什么"没有答案
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      # 拿不到连接要快速失败并报错，而不是让请求无限等下去把 Tomcat 线程一起拖死
      connection-timeout: 3000
      validation-timeout: 2000
      idle-timeout: 600000
      # 刻意小于 MySQL 默认 wait_timeout(8h)，否则连接被服务端单方面关掉后才会在使用时暴露
      max-lifetime: 1740000
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:1234}
    # 两个时钟，别混成一件事（Spring Boot 的元数据里 timeout 就是 "Read timeout"）：
    #   timeout         = 命令发出后等回话的上限
    #   connect-timeout = 建连本身的上限；不写时 Lettuce 默认 10s
    # 原来只写了 timeout: 3s，且是"没量过所以往宽里放"。2026-10-28 量准了（WORKLOG S-124）：
    # 正常路径客户端往返 P99 0.13~0.17ms、服务端 P99 1~66µs，200 线程并发下没有一条超过 1ms。
    # 500ms 是这个数的约 3800 倍，正常命令撞不到线；能撞到只可能是 Redis 整体不执行了
    # （磁盘卡、swap、CPU 被抢）——那正是应该快速失败的时刻。
    # 代价说清楚：Redis 挂掉时（WORKLOG S-122 实测），每个请求原来白占 Tomcat 线程 3.01 秒
    # → 200 线程 ÷ 3s ≈ 66 rps 就把池子打满，之后连不依赖 Redis 的接口一起排队。
    # 改成 500ms 后同样的池子能扛约 400 rps。读路径另加了"超时就查库"的兜底
    # （ShopServiceImpl / CategoryServiceImpl），所以这半秒对用户多数时候是不可见的。
    # connect-timeout 必须一起写：本机"服务停掉"是立刻 RST，所以 3s 那会儿没暴露问题；
    # 换成防火墙丢包那种连不通，每个请求要挂满默认的 10 秒——比 3s 还糟。
    timeout: 500ms
    connect-timeout: 500ms
  # Flyway：db/migration 下的 V1__…V16__ 由它管，新脚本丢进目录就会随启动应用。
  #
  # baseline-version=16 是给**本机这份已经手工 source 过全部脚本的库**用的：
  # Flyway 建 flyway_schema_history 时直接插一条基线记录，V1-V16 一个都不重跑，
  # 从 V17 起才真正执行。空库（比如 CI 或新环境）不会走基线，V1 起全部按序重放。
  # 这条区分很重要：没有它，接 Flyway 的第一次启动就会把存量库当空库去建表。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 16
    baseline-description: 存量库，V1-V16 已手工执行
    validate-on-migrate: true
  jackson:
    deserialization:
      # 小数按 BigDecimal 解析，不要先过 double。否则 "88.00" 会变成标度为 1 的 88.0，
      # 金额一路算下去就会出现"下单响应 304.0、之后 GET 同一单 304.00"的表示不一致。
      use-big-decimal-for-floats: true
  servlet:
    multipart:
      # 三层必须对齐并且让**业务那一层先触发**：原来 nginx 3m / multipart 5MB / ImagePolicy 2MB，
      # 结果 2~3MB 的文件穿过 nginx 和 multipart 两道闸、进到大后端把字节全量读进堆里才被拒。
      # 现在 multipart 等于业务上限 2MB，超它由 CommonExceptionHandler 统一回一句人话。
      max-file-size: ${UPLOAD_MAX_SIZE_MB:2}MB
      max-request-size: 4MB

# MyBatis：简单 SQL 写在 Mapper 接口的注解里，动态分页写在 resources/mapper 下的 XML。
# 下划线转驼峰开启后，nick_name 直接映射到实体的 nickName，不用逐列写 result。
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 语句超时：没有这一条，一条慢查询会一直占着 Hikari 连接（池只有 10 个），
    # 表现是"个别接口把整个应用拖住"。10 秒对本项目的任何正常查询都足够。
    default-statement-timeout: 10

# 文件上传：mode=local 落本机磁盘（默认），mode=oss 走阿里云 OSS。
# 两个适配器共用同一套校验和对象键形状，切换只改这一个开关（见 config/FileStorageConfiguration）。
# AccessKey 只从环境变量读，仓库里不留真实凭证；mode=oss 而密钥为空时启动直接失败。
linli:
  upload:
    mode: ${UPLOAD_MODE:local}
    dir: ${UPLOAD_DIR:uploads}
    public-prefix: ${UPLOAD_PUBLIC_PREFIX:/api/file/images}
    max-size-mb: ${UPLOAD_MAX_SIZE_MB:2}
    oss:
      endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
      bucket-name: ${OSS_BUCKET_NAME:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      # 自定义域名/CDN 才需要填；留空则用 https://{bucket}.{endpoint}
      public-base-url: ${OSS_PUBLIC_BASE_URL:}
  cache:
    # 一级缓存（进程内 Caffeine）总开关。关掉之后 get 恒 null、put 不写，等于退回"只有 Redis"那一层，
    # 线上出问题不用回滚发版，改这个值重启即可；A/B 实测也是靠它跑的（见 docs/WORKLOG.md S-117）。
    l1-enabled: ${CACHE_L1_ENABLED:true}
    # 只给"与访问者无关"的值用（分类列表、商家详情的 Shop 实体），所以条目数很小就够：
    # 全局单键 + 每家商家一条。500 已经远超当前 8 家店的量级，留着是给压测那批数据用的。
    l1-max-entries: ${CACHE_L1_MAX_ENTRIES:500}
    # 一级缓存的寿命。**这个 5 秒就是"多实例部署时本地缓存怎么失效"的答案**：
    # 同实例的写路径直接 invalidate（立即生效），跨实例最坏是旧数据多活 5 秒。
    # 要连这 5 秒都不留就得引 Redis pub/sub 广播失效——一整条链路的复杂度，换这几条
    # "运营配置和展示分"的 key 不值。哪天真的多实例并且有人反馈"改了没生效"，再升级，接口形状不用变。
    l1-ttl-seconds: ${CACHE_L1_TTL_SECONDS:5}
  order:
    # 下单后多久没支付就被定时任务关掉。取消原因文案由 Order.TIMEOUT_CANCEL_REASON 提供，
    # 阈值改这里即可，不会出现"改了阈值文案还对不上"的问题。
    pay-timeout-minutes: ${ORDER_PAY_TIMEOUT_MINUTES:5}
    # 团购核销码的有效期天数，从下单时间往后算。
    valid-days: ${ORDER_VALID_DAYS:30}
  auth:
    # 把验证码打进日志只为本地调试，默认关闭，由 application-dev.yml 打开。
    log-code: false
  cors:
    # 只有 Vite 开发服务器需要跨域；生产是 Nginx 同源，留空即不注册 CORS 规则。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# 健康检查交给 actuator：它会真的探 MySQL 和 Redis，
# 原来的 /api/health 现在只是把它的答案换个路径转述一遍。
management:
  endpoints:
    web:
      exposure:
        # 加上 metrics 和 prometheus：只有 health 的话"能探活但不能观测"，
        # 接口 P99、连接池占用、JVM 内存这些一个都看不见。Nginx 不代理 /actuator，
        # 所以这两个端点只在 :8080 本机/内网可达，不会顺着 80 暴露出去。
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        # 打开后多出 /actuator/health/liveness 和 /actuator/health/readiness 两个探针
        enabled: true
  info:
    env:
      enabled: false

logging:
  level:
    root: info
